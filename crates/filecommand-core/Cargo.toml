[target.'cfg(windows)'.dependencies]
# All Win32 calls (drive enumeration, volume information, free space, memory
# status, file identity, alternate-data-stream enumeration, `CopyFileExW`,
# `ReplaceFileW`) go through the shared workspace binding; no prototype is
# hand-declared (ci-and-build-tooling design D6).
windows-sys = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
