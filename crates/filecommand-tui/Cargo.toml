[package]
name = "filecommand-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FileCommand terminal UI binary: event loop, rendering, terminal ownership"
default-run = "filecommand"

[[bin]]
name = "filecommand"
path = "src/main.rs"

[dependencies]
filecommand-core = { path = "../filecommand-core" }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows clipboard: CF_HDROP file objects + "Preferred DropEffect" for the
# clipboard-export Files action (design D3).
clipboard-win = "5.4"

[target.'cfg(not(windows))'.dependencies]
# Non-Windows fallback: text-only clipboard (Paths/Names; Files falls back
# to Paths text) (design D5).
arboard = "3.6"

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
