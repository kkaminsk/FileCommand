[package]
name = "filecommand-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FileCommand terminal UI binary: event loop, rendering, terminal ownership"
default-run = "filecommand"

[[bin]]
name = "filecommand"
path = "src/main.rs"

[dependencies]
filecommand-core = { path = "../filecommand-core" }
ratatui = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Windows clipboard: CF_HDROP file objects + "Preferred DropEffect" for the
# clipboard-export Files action (design D3).
clipboard-win = "5.4"
# Open with the associated application: ShellExecuteW with the `open` verb
# (open-with-associated-app; design D1). `Win32_System_Console` is for the
# console control handler that keeps Ctrl+C during a suspended child run
# from ending FileCommand (process-lifecycle-hardening design D1).
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(not(windows))'.dependencies]
# Non-Windows fallback: text-only clipboard (Paths/Names; Files falls back
# to Paths text) (design D5).
arboard = "3.6"

[target.'cfg(unix)'.dependencies]
# SIGINT/SIGQUIT ignored in the parent while a suspended child runs
# (process-lifecycle-hardening design D2). Already in the lock graph via
# crossterm, mio, and signal-hook, so no new crate is built.
libc = "0.2"

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }
