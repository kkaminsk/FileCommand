# Continuous integration for FileCommand (build-tooling capability; design D1).
#
# `windows` and `msrv` are the required checks (branch protection on `main`
# lists them). `linux` is best-effort and never blocks a merge: non-Windows
# builds are best-effort per the project charter.
#
# The stable toolchain is pinned to one version so a Rust release cannot turn
# `-D warnings` red on an unchanged branch. Bump RUST_TOOLCHAIN deliberately,
# in a PR that also fixes whatever new lints the release brings.

name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  RUST_TOOLCHAIN: "1.98.1"
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The floor is whatever `[workspace.package] rust-version` says, so the
      # manifest and this job cannot drift apart.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          version=$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install rust-version toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Check on the declared minimum toolchain
        run: cargo check --workspace --all-targets --locked

  linux:
    name: linux (best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned stable toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
